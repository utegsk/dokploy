name: uteg images

on:
  push:
    branches: [uteg]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOKPLOY_IMAGE: ghcr.io/utegsk/dokploy
  MONITORING_IMAGE: ghcr.io/utegsk/dokploy-monitoring

concurrency:
  group: uteg-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version apps/dokploy/package.json)-uteg.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  monitoring:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.monitoring
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.MONITORING_IMAGE }}:${{ needs.meta.outputs.version }}
            ${{ env.MONITORING_IMAGE }}:latest
          cache-from: type=gha,scope=monitoring
          cache-to: type=gha,mode=max,scope=monitoring

  dokploy:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            UTEG_VERSION=${{ needs.meta.outputs.version }}
            MONITORING_IMAGE=${{ env.MONITORING_IMAGE }}:${{ needs.meta.outputs.version }}
          tags: |
            ${{ env.DOKPLOY_IMAGE }}:${{ needs.meta.outputs.version }}
            ${{ env.DOKPLOY_IMAGE }}:latest
          cache-from: type=gha,scope=dokploy
          cache-to: type=gha,mode=max,scope=dokploy
