name: uteg upstream sync

# Opens a PR merging the latest upstream Dokploy release into `uteg`.
# Needs secret SYNC_TOKEN (fine-grained PAT on utegsk/dokploy: contents, pull
# requests and workflows read/write). Without it GITHUB_TOKEN is used, which
# can't push upstream changes to .github/workflows and whose PRs don't trigger
# uteg CI.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to merge (default: latest release)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: uteg-upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: uteg
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Resolve upstream tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view -R Dokploy/dokploy --json tagName --jq .tagName)
          fi
          git remote add upstream https://github.com/Dokploy/dokploy.git
          git fetch --quiet --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
          branch="sync/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "skip=already merged" >> "$GITHUB_OUTPUT"
          elif [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[0].number')" ]; then
            echo "skip=PR for $branch already exists" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.tag.outputs.skip != ''
        run: echo "${{ steps.tag.outputs.skip }}"

      - name: Merge upstream tag
        id: merge
        if: steps.tag.outputs.skip == ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ steps.tag.outputs.branch }}
        run: |
          git config user.name "uteg-sync"
          git config user.email "uteg-sync@users.noreply.github.com"
          git switch -c "$BRANCH"
          if git merge --no-ff --no-edit -m "Merge upstream $TAG into uteg" "$TAG"; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflicts=$files" >> "$GITHUB_OUTPUT"
            # Commit the markers so a person can resolve them on the PR branch.
            git add -A
            git commit --no-verify -m "Merge upstream $TAG into uteg (CONFLICTS: $files)"
          fi
          git push origin "$BRANCH"

      - name: Open PR
        if: steps.tag.outputs.skip == ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ steps.tag.outputs.branch }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          gh label create sync-conflict --color B60205 --force >/dev/null
          {
            echo "Merges upstream [$TAG](https://github.com/Dokploy/dokploy/releases/tag/$TAG) into \`uteg\`."
            echo
            if [ -n "$CONFLICTS" ]; then
              echo "**Merge conflicts** — committed with markers, resolve on this branch:"
              echo
              for f in $CONFLICTS; do echo "- \`$f\`"; done
              echo
              echo "Check each against PATCHES.md."
            else
              echo "Merged cleanly. Review the upstream release notes and uteg CI, then merge."
            fi
            echo
            echo "Merging builds \`ghcr.io/utegsk/dokploy:${TAG}-uteg.N\` and starts the deploy (needs approval)."
          } > body.md
          args=(--base uteg --head "$BRANCH" --title "Sync upstream $TAG" --body-file body.md)
          if [ -n "$CONFLICTS" ]; then
            args+=(--draft --label sync-conflict)
          fi
          url=$(gh pr create "${args[@]}")
          echo "PR: $url"
          echo "url=$url" >> "$GITHUB_ENV"

      - name: Notify Slack
        if: steps.tag.outputs.skip == '' && env.SLACK_WEBHOOK_URL != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          if [ -n "$CONFLICTS" ]; then
            text=":warning: Dokploy upstream $TAG has merge conflicts: $url"
          else
            text=":arrows_counterclockwise: Dokploy upstream $TAG ready to review: $url"
          fi
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS -m 10 -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
